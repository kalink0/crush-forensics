name: Build Portable Apps

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UL_VERSION: "0.6.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Version pinned inside scripts/download_peach_binaries.py itself (not
      # an env var here, unlike UL_VERSION below) -- simplest done once in
      # Python rather than duplicated across bash/pwsh per platform, and this
      # is the single source of truth for the pinned version, not a second
      # one to keep in sync. Downloads all 3 platforms regardless of runner
      # OS (mildly wasteful, avoids OS-gating the one step needed). macOS is
      # a single universal binary as of peach v0.2.1, so no arch-specific
      # variable is needed for it (unlike unifiedlog_iterator below).
      - name: Download peach-forensics binaries
        run: python scripts/download_peach_binaries.py

      # Set arch-specific variables for macOS builds
      - name: Set macOS build vars
        if: runner.os == 'macOS'
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            echo "MACOS_UL_BINARY=unifiedlog_iterator-aarch64-apple-darwin" >> $GITHUB_ENV
            echo "MACOS_ARTIFACT=crush-macos-arm-${{ github.ref_name }}.zip" >> $GITHUB_ENV
          else
            echo "MACOS_UL_BINARY=unifiedlog_iterator-x86_64-apple-darwin" >> $GITHUB_ENV
            echo "MACOS_ARTIFACT=crush-macos-intel-${{ github.ref_name }}.zip" >> $GITHUB_ENV
          fi

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          # Runner image ships a packages.microsoft.com apt source (for azure-cli)
          # that we never use; drop it so a transient outage there doesn't fail
          # apt-get update for everyone else.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libpulse0 \
            librsvg2-bin

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libmagic

      - name: Install Python deps (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install --only-binary=cryptography -c release-constraints.txt .

      - name: Install Python deps (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller Pillow
          python -m pip install --only-binary=cryptography -c release-constraints.txt .
          python -m pip install python-magic-bin

      - name: Download unifiedlog_iterator binary (Linux)
        if: runner.os == 'Linux'
        run: |
          ASSET="unifiedlog_iterator-v${UL_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          URL="https://github.com/mandiant/macos-UnifiedLogs/releases/download/v${UL_VERSION}/${ASSET}"
          mkdir -p crush/bin/unifiedlog_iterator
          mkdir -p /tmp/ul-extract
          curl -fsSL "$URL" -o /tmp/ul.tar.gz
          tar -xzf /tmp/ul.tar.gz -C /tmp/ul-extract
          find /tmp/ul-extract -name 'unifiedlog_iterator' -type f \
            | head -1 \
            | xargs -I{} cp {} crush/bin/unifiedlog_iterator/unifiedlog_iterator-x86_64-unknown-linux-gnu
          chmod +x crush/bin/unifiedlog_iterator/unifiedlog_iterator-x86_64-unknown-linux-gnu
          echo "$UL_VERSION" > crush/bin/unifiedlog_iterator/VERSION.txt

      - name: Download unifiedlog_iterator binary (macOS)
        if: runner.os == 'macOS'
        run: |
          ASSET="unifiedlog_iterator-v${UL_VERSION}-${MACOS_UL_BINARY#unifiedlog_iterator-}.tar.gz"
          URL="https://github.com/mandiant/macos-UnifiedLogs/releases/download/v${UL_VERSION}/${ASSET}"
          mkdir -p crush/bin/unifiedlog_iterator /tmp/ul-extract
          curl -fsSL "$URL" -o /tmp/ul.tar.gz
          tar -xzf /tmp/ul.tar.gz -C /tmp/ul-extract
          find /tmp/ul-extract -name 'unifiedlog_iterator' -type f \
            | head -1 \
            | xargs -I{} cp {} crush/bin/unifiedlog_iterator/${MACOS_UL_BINARY}
          chmod +x crush/bin/unifiedlog_iterator/${MACOS_UL_BINARY}
          echo "$UL_VERSION" > crush/bin/unifiedlog_iterator/VERSION.txt

      - name: Download unifiedlog_iterator binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ASSET = "unifiedlog_iterator-v$env:UL_VERSION-x86_64-pc-windows-msvc.zip"
          $URL   = "https://github.com/mandiant/macos-UnifiedLogs/releases/download/v$env:UL_VERSION/$ASSET"
          New-Item -ItemType Directory -Force -Path crush\bin\unifiedlog_iterator | Out-Null
          Invoke-WebRequest -Uri $URL -OutFile "$env:TEMP\ul.zip"
          Expand-Archive -Path "$env:TEMP\ul.zip" -DestinationPath "$env:TEMP\ul-extract" -Force
          Get-ChildItem "$env:TEMP\ul-extract" -Recurse -Filter "unifiedlog_iterator.exe" `
            | Select-Object -First 1 `
            | Copy-Item -Destination "crush\bin\unifiedlog_iterator\unifiedlog_iterator-x86_64-pc-windows-msvc.exe"
          Set-Content -Path "crush\bin\unifiedlog_iterator\VERSION.txt" -Value $env:UL_VERSION -NoNewline

      - name: Compile translations
        run: python scripts/i18n.py release

      - name: Generate icon (Linux → crush_icon_256.png)
        if: runner.os == 'Linux'
        run: rsvg-convert -w 256 -h 256 crush/resources/icons/crush_icon_128.svg -o crush_icon_256.png

      - name: Generate icon (macOS → crush.icns)
        if: runner.os == 'macOS'
        run: QT_QPA_PLATFORM=offscreen python scripts/make_icons.py

      - name: Generate icon (Windows → crush.ico)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set QT_QPA_PLATFORM=offscreen
          python scripts/make_icons.py

      - name: Build (PyInstaller) Linux
        if: runner.os == 'Linux'
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name crush \
            --collect-all PySide6 \
            --collect-all magic \
            --collect-all pillow_heif \
            --collect-all pillow_jxl \
            --collect-all av \
            --exclude-module pkg_resources \
            --exclude-module PySide6.QtWebEngineCore \
            --exclude-module PySide6.QtWebEngineWidgets \
            --exclude-module PySide6.QtWebEngineQuick \
            --exclude-module PySide6.QtQml \
            --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtQuick3D \
            --exclude-module PySide6.Qt3DAnimation \
            --exclude-module PySide6.Qt3DCore \
            --exclude-module PySide6.Qt3DExtras \
            --exclude-module PySide6.Qt3DInput \
            --exclude-module PySide6.Qt3DLogic \
            --exclude-module PySide6.Qt3DRender \
            --exclude-module PySide6.QtBluetooth \
            --exclude-module PySide6.QtNfc \
            --exclude-module PySide6.QtSensors \
            --exclude-module PySide6.QtPositioning \
            --exclude-module PySide6.QtRemoteObjects \
            --exclude-module PySide6.QtSerialPort \
            --exclude-module PySide6.QtDataVisualization \
            --exclude-module PySide6.QtCharts \
            --add-data "crush/data/formats.db:data" \
            --add-data "crush/i18n:crush/i18n" \
            --add-data "crush/resources/icons/crush_icon_128.svg:crush/resources/icons/" \
            --add-data "crush_icon_256.png:crush/resources/icons/" \
            --add-data "crush/bin/unifiedlog_iterator/unifiedlog_iterator-x86_64-unknown-linux-gnu:crush/bin/unifiedlog_iterator/" \
            --add-data "crush/bin/unifiedlog_iterator/VERSION.txt:crush/bin/unifiedlog_iterator/" \
            --add-data "crush/bin/peach/peach-linux:crush/bin/peach/" \
            --add-data "crush/bin/peach/VERSION.txt:crush/bin/peach/" \
            crush/__main__.py

      - name: Build (PyInstaller) macOS
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name crush \
            --icon crush.icns \
            --collect-all PySide6 \
            --collect-all magic \
            --collect-all pillow_heif \
            --collect-all pillow_jxl \
            --collect-all av \
            --exclude-module pkg_resources \
            --exclude-module PySide6.QtWebEngineCore \
            --exclude-module PySide6.QtWebEngineWidgets \
            --exclude-module PySide6.QtWebEngineQuick \
            --exclude-module PySide6.QtQml \
            --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtQuick3D \
            --exclude-module PySide6.Qt3DAnimation \
            --exclude-module PySide6.Qt3DCore \
            --exclude-module PySide6.Qt3DExtras \
            --exclude-module PySide6.Qt3DInput \
            --exclude-module PySide6.Qt3DLogic \
            --exclude-module PySide6.Qt3DRender \
            --exclude-module PySide6.QtBluetooth \
            --exclude-module PySide6.QtNfc \
            --exclude-module PySide6.QtSensors \
            --exclude-module PySide6.QtPositioning \
            --exclude-module PySide6.QtRemoteObjects \
            --exclude-module PySide6.QtSerialPort \
            --exclude-module PySide6.QtDataVisualization \
            --exclude-module PySide6.QtCharts \
            --add-data "crush/data/formats.db:data" \
            --add-data "crush/i18n:crush/i18n" \
            --add-data "crush/resources/icons/crush_icon_128.svg:crush/resources/icons/" \
            --add-data "crush/bin/unifiedlog_iterator/${MACOS_UL_BINARY}:crush/bin/unifiedlog_iterator/" \
            --add-data "crush/bin/unifiedlog_iterator/VERSION.txt:crush/bin/unifiedlog_iterator/" \
            --add-data "crush/bin/peach/peach-macos:crush/bin/peach/" \
            --add-data "crush/bin/peach/VERSION.txt:crush/bin/peach/" \
            crush/__main__.py

      - name: Strip unused Qt frameworks (macOS)
        if: runner.os == 'macOS'
        run: |
          # PyInstaller 6+ bundles into _internal/; fall back to MacOS/ for older versions
          for root in "dist/crush.app/Contents/MacOS/_internal" "dist/crush.app/Contents/MacOS"; do
            lib="$root/PySide6/Qt/lib"
            [ -d "$lib" ] || continue
            for mod in \
              QtWebEngineCore QtWebEngineWidgets QtWebEngineQuick \
              Qt3DAnimation Qt3DCore Qt3DExtras Qt3DInput Qt3DLogic Qt3DRender \
              QtBluetooth QtNfc QtSensors \
              QtPositioning QtRemoteObjects QtSerialPort QtDataVisualization \
              QtCharts QtQml QtQuick QtQuick3D; do
              rm -rf "$lib/${mod}.framework"
            done
            find "$root" -name "QtWebEngineProcess*" -prune -exec rm -rf {} \; 2>/dev/null || true
          done

      - name: Build (PyInstaller) Windows
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name crush `
            --icon crush.ico `
            --collect-all magic `
            --collect-all pillow_heif `
            --collect-all pillow_jxl `
            --collect-all av `
            --exclude-module pkg_resources `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.QtWebEngineQuick `
            --exclude-module PySide6.QtQml `
            --exclude-module PySide6.QtQuick `
            --exclude-module PySide6.QtQuick3D `
            --exclude-module PySide6.Qt3DAnimation `
            --exclude-module PySide6.Qt3DCore `
            --exclude-module PySide6.Qt3DExtras `
            --exclude-module PySide6.Qt3DInput `
            --exclude-module PySide6.Qt3DLogic `
            --exclude-module PySide6.Qt3DRender `
            --exclude-module PySide6.QtBluetooth `
            --exclude-module PySide6.QtNfc `
            --exclude-module PySide6.QtSensors `
            --exclude-module PySide6.QtPositioning `
            --exclude-module PySide6.QtRemoteObjects `
            --exclude-module PySide6.QtSerialPort `
            --exclude-module PySide6.QtDataVisualization `
            --exclude-module PySide6.QtCharts `
            --add-data "crush/data/formats.db;data" `
            --add-data "crush/i18n;crush/i18n" `
            --add-data "crush/resources/icons/crush_icon_128.svg;crush/resources/icons/" `
            --add-data "crush/bin/unifiedlog_iterator/unifiedlog_iterator-x86_64-pc-windows-msvc.exe;crush/bin/unifiedlog_iterator/" `
            --add-data "crush/bin/unifiedlog_iterator/VERSION.txt;crush/bin/unifiedlog_iterator/" `
            --add-data "crush/bin/peach/peach-windows.exe;crush/bin/peach/" `
            --add-data "crush/bin/peach/VERSION.txt;crush/bin/peach/" `
            crush/__main__.py

      - name: Package artifact (Linux → AppImage)
        if: runner.os == 'Linux'
        run: |
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O /tmp/appimagetool
          chmod +x /tmp/appimagetool

          mkdir -p AppDir
          cp -r dist/crush AppDir/crush

          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/crush/crush" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/crush.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Crush
          Exec=crush
          Icon=crush
          Categories=Utility;Security;
          EOF

          cp crush_icon_256.png AppDir/crush.png

          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run AppDir \
            crush-linux-${{ github.ref_name }}.AppImage

      - name: Package artifact (macOS → ZIP)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/crush.app "${MACOS_ARTIFACT}"

      - name: Smoke test packaged macOS app
        if: runner.os == 'macOS'
        run: |
          extract_dir="$RUNNER_TEMP/crush-smoke"
          log_file="$RUNNER_TEMP/crush-smoke.log"
          ditto -x -k "${MACOS_ARTIFACT}" "$extract_dir"
          executable="$extract_dir/crush.app/Contents/MacOS/crush"

          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            expected_arch="arm64"
          else
            expected_arch="x86_64"
          fi
          actual_archs="$(lipo -archs "$executable")"
          echo "Packaged executable architectures: $actual_archs"
          grep -qw "$expected_arch" <<<"$actual_archs"

          QT_QPA_PLATFORM=offscreen "$executable" >"$log_file" 2>&1 &
          app_pid=$!
          sleep 5
          if ! kill -0 "$app_pid" 2>/dev/null; then
            set +e
            wait "$app_pid" 2>/dev/null
            exit_code=$?
            set -e
            cat "$log_file"
            echo "Smoke test failed: app exited early with status $exit_code"
            exit 1
          fi

          echo "App remained running for 5 seconds; stopping smoke test process."
          kill "$app_pid"
          set +e
          wait "$app_pid" 2>/dev/null
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 143 ]; then
            cat "$log_file"
            echo "Smoke test failed: expected SIGTERM exit status 143, got $exit_code"
            exit 1
          fi
          echo "Smoke test passed."

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist\crush.exe -DestinationPath crush-windows-${{ github.ref_name }}.zip

      - name: Upload release asset (Linux)
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          files: crush-linux-${{ github.ref_name }}.AppImage

      - name: Upload release asset (macOS)
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.MACOS_ARTIFACT }}

      - name: Upload release asset (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: crush-windows-${{ github.ref_name }}.zip

  # Forensic integrity audit, run fresh on the release's own commit with the
  # same pinned dependencies as the shipped binaries (release-constraints.txt)
  # -- not reused from an earlier CI run, so the report attached to the
  # release describes exactly this tag. Only @pytest.mark.forensic tests.
  forensic-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libmagic1 \
            libpulse0

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libmagic

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=cryptography -c release-constraints.txt ".[dev]"

      - name: Install Python deps (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install python-magic-bin

      - name: Forensic tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -m forensic -q -p no:cacheprovider

      # Uploaded even when tests failed: a failing report is still published.
      - name: Upload run data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forensic-audit-${{ matrix.os }}
          path: reports/forensic_audit.json
          if-no-files-found: warn

  # Merge the per-OS runs into one report and attach it to the release under
  # a version-less name, so .../releases/latest/download/crush-forensic-audit.html
  # always points at the newest release's report (the version is inside it).
  # Published whatever the outcome -- a FAIL is attached and shown in the
  # release notes, then this job goes red.
  forensic-audit-publish:
    needs: forensic-audit
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download run data
        uses: actions/download-artifact@v4
        with:
          pattern: forensic-audit-*
          path: audit-runs

      - name: Combine report
        run: |
          python scripts/combine_forensic_audit.py audit-runs/*/forensic_audit.json \
            --html crush-forensic-audit.html \
            --json crush-forensic-audit.json \
            --notes forensic-audit-notes.md \
            --expected 3 \
            --report-url "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/crush-forensic-audit.html"

      - name: Attach report to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            crush-forensic-audit.html
            crush-forensic-audit.json
          body_path: forensic-audit-notes.md
          append_body: true

      - name: Fail on audit failure
        if: needs.forensic-audit.result != 'success'
        run: |
          echo "Forensic audit did not pass on every platform (${{ needs.forensic-audit.result }}); the report was attached anyway."
          exit 1
