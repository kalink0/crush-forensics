name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    if: false  # TEMPORARY, diagnostic branch only: run just diagnose-segfault
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libmagic1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy crush

      - name: Translation catalogs
        run: python scripts/i18n.py check

  test:
    if: false  # TEMPORARY, diagnostic branch only: run just diagnose-segfault
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libmagic1 \
            libpulse0

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libmagic

      - name: Install Python deps (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Install Python deps (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
          python -m pip install python-magic-bin

      # The .fbs schema tests run the bundled flatc. Not on macOS: there the
      # script builds flatc from source (minutes per run); those tests skip
      # with their reason, the .bfbs tests run everywhere.
      - name: Download flatc (Linux/Windows)
        if: runner.os != 'macOS'
        run: python scripts/download_flatc_binaries.py

      - name: Pytest (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p reports
          python -m pytest -q \
            --junit-xml=reports/junit.xml \
            --html=reports/test_report.html \
            --self-contained-html

      - name: Pytest (Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          python -m pytest -q `
            --junit-xml=reports/junit.xml `
            --html=reports/test_report.html `
            --self-contained-html
        shell: pwsh

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forensic-test-report-${{ matrix.os }}
          path: reports/
          retention-days: 90

  # TEMPORARY -- diagnose the Linux segfault in PropertiesPanel.clear()
  # (test_props_panel_tab_refresh). Not for merging: removed once the cause
  # is fixed. Runs the suite with core dumps and prints the C/C++ stack of
  # every thread from the dump, then once more with glibc's malloc checks,
  # which abort at the free that corrupts the heap instead of at a later
  # victim.
  diagnose-segfault:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Runner image and system libraries
        run: |
          cat /etc/os-release
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          ldd --version | head -1

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gdb \
            libgl1 \
            libegl1 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libmagic1 \
            libpulse0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
          python -m pip list

      - name: Download flatc
        run: python scripts/download_flatc_binaries.py

      # glibc's malloc checks catch the heap corruption where it happens
      # (C++ stack seen: Shiboken::Object::destroy -> free() abort, from
      # PropertiesPanel.clear() and from a QWidget deleting a Python-made
      # QtCore child). It aborted only under gdb (2 of 3 runs; 0 of 3
      # without), so this runs under gdb and prints the Python stack of
      # every thread with CPython's gdb extension (py-bt). Up to three runs,
      # stopping at the first abort.
      - name: Malloc-check runs under gdb with the Python stack at the abort
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          MALLOC_CHECK_: "3"
          MALLOC_PERTURB_: "165"
        run: |
          pyver=$(python -c "import platform; print(platform.python_version())")
          curl -fsSL -o /tmp/libpython.py \
            "https://raw.githubusercontent.com/python/cpython/v${pyver}/Tools/gdb/libpython.py"
          for i in 1 2 3; do
            rc=0
            gdb -q -batch -return-child-result \
              -ex "set pagination off" \
              -ex "handle SIGPIPE nostop noprint pass" \
              -ex "source /tmp/libpython.py" \
              -ex "set environment LD_PRELOAD /lib/x86_64-linux-gnu/libc_malloc_debug.so.0" \
              -ex run \
              -ex "echo \n=== C++ stack ===\n" \
              -ex "bt 30" \
              -ex "echo \n=== Python stack, all threads ===\n" \
              -ex "thread apply all py-bt" \
              --args python -X faulthandler -m pytest -q -p no:cacheprovider \
              > "/tmp/run-$i.log" 2>&1 || rc=$?
            if grep -q "received signal" "/tmp/run-$i.log"; then
              echo "=== run $i: ABORT (exit $rc) ==="
              sed -n '/received signal/,$p' "/tmp/run-$i.log"
              break
            fi
            echo "=== run $i: no abort (exit $rc) -- $(grep -E '[0-9]+ (passed|failed)' "/tmp/run-$i.log" | tail -1) ==="
          done
