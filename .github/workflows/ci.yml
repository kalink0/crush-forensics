name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    if: false  # TEMPORARY, diagnostic branch only: run just diagnose-segfault
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libmagic1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy crush

      - name: Translation catalogs
        run: python scripts/i18n.py check

  test:
    if: false  # TEMPORARY, diagnostic branch only: run just diagnose-segfault
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libmagic1 \
            libpulse0

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libmagic

      - name: Install Python deps (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Install Python deps (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
          python -m pip install python-magic-bin

      # The .fbs schema tests run the bundled flatc. Not on macOS: there the
      # script builds flatc from source (minutes per run); those tests skip
      # with their reason, the .bfbs tests run everywhere.
      - name: Download flatc (Linux/Windows)
        if: runner.os != 'macOS'
        run: python scripts/download_flatc_binaries.py

      - name: Pytest (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p reports
          python -m pytest -q \
            --junit-xml=reports/junit.xml \
            --html=reports/test_report.html \
            --self-contained-html

      - name: Pytest (Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          python -m pytest -q `
            --junit-xml=reports/junit.xml `
            --html=reports/test_report.html `
            --self-contained-html
        shell: pwsh

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forensic-test-report-${{ matrix.os }}
          path: reports/
          retention-days: 90

  # TEMPORARY -- diagnose the Linux segfault in PropertiesPanel.clear()
  # (test_props_panel_tab_refresh). Not for merging: removed once the cause
  # is fixed.
  #
  # Each tool changes whether the crash shows (under gdb no segfault; with
  # glibc's malloc checks an abort in 2 of 3 runs under gdb, 0 of 3
  # without), so every variant runs in parallel, each up to three times
  # until the first crash, with all the output it can give:
  #   plain       -- as the test job; core dump, read by gdb afterwards
  #   malloc      -- glibc malloc checks, no gdb; core dump as above
  #   gdb         -- under gdb
  #   gdb-malloc  -- under gdb with glibc malloc checks
  # At a crash: faulthandler's Python stack (without gdb), the C++ stack and
  # every thread's Python stack (gdb, CPython's py-bt). After every run:
  # the end of its log, whatever the outcome.
  diagnose-segfault:
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, malloc, gdb, gdb-malloc]
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Runner image and system libraries
        run: |
          cat /etc/os-release
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          ldd --version | head -1
          nproc
          free -m

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gdb \
            libgl1 \
            libegl1 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libmagic1 \
            libpulse0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
          python -m pip list

      - name: Download flatc
        run: python scripts/download_flatc_binaries.py

      - name: Prepare core dumps and CPython's gdb extension
        run: |
          mkdir -p /tmp/cores
          sudo sysctl -w kernel.core_pattern=/tmp/cores/core.%p
          ls -l /lib/x86_64-linux-gnu/libc_malloc_debug.so.0
          pyver=$(python -c "import platform; print(platform.python_version())")
          curl -fsSL -o /tmp/libpython.py \
            "https://raw.githubusercontent.com/python/cpython/v${pyver}/Tools/gdb/libpython.py"
          ls -l /tmp/libpython.py

      - name: Pytest (${{ matrix.variant }}), up to 3 runs until a crash
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          VARIANT: ${{ matrix.variant }}
        run: |
          set -x
          ulimit -c unlimited
          PYTEST=(python -X faulthandler -m pytest -q -p no:cacheprovider)
          GDB=(gdb -q -batch -return-child-result
               -ex "set pagination off"
               -ex "handle SIGPIPE nostop noprint pass"
               -ex "source /tmp/libpython.py")
          GDB_AT_CRASH=(-ex "echo \n=== C++ stack, all threads ===\n"
                        -ex "thread apply all bt 40"
                        -ex "echo \n=== Python stack, all threads ===\n"
                        -ex "thread apply all py-bt")
          MALLOC_ENV=(MALLOC_CHECK_=3 MALLOC_PERTURB_=165
                      LD_PRELOAD=/lib/x86_64-linux-gnu/libc_malloc_debug.so.0)
          crashed=""
          for i in 1 2 3; do
            log="/tmp/run-$i.log"
            echo "=== run $i ($VARIANT) start: $(date -u +%T) ==="
            rc=0
            case "$VARIANT" in
              plain)
                "${PYTEST[@]}" > "$log" 2>&1 < /dev/null || rc=$? ;;
              malloc)
                env "${MALLOC_ENV[@]}" "${PYTEST[@]}" > "$log" 2>&1 < /dev/null || rc=$? ;;
              gdb)
                "${GDB[@]}" -ex run "${GDB_AT_CRASH[@]}" \
                  --args "${PYTEST[@]}" > "$log" 2>&1 < /dev/null || rc=$? ;;
              gdb-malloc)
                "${GDB[@]}" \
                  -ex "set environment MALLOC_CHECK_ 3" \
                  -ex "set environment MALLOC_PERTURB_ 165" \
                  -ex "set environment LD_PRELOAD /lib/x86_64-linux-gnu/libc_malloc_debug.so.0" \
                  -ex run "${GDB_AT_CRASH[@]}" \
                  --args "${PYTEST[@]}" > "$log" 2>&1 < /dev/null || rc=$? ;;
            esac
            echo "=== run $i ($VARIANT) end: $(date -u +%T), exit $rc ==="
            echo "--- end of log ---"
            tail -n 40 "$log" || true
            if grep -q "Fatal Python error\|received signal" "$log"; then
              crashed="run $i"
              echo "=== run $i: CRASH ==="
              grep -n -A400 -m1 "Fatal Python error\|received signal" "$log" || true
              break
            fi
            echo "=== run $i: no crash ==="
          done
          for core in /tmp/cores/core.*; do
            [ -e "$core" ] || { echo "no core dump"; break; }
            echo "=== core dump $core ==="
            gdb -q -batch \
              -ex "set pagination off" \
              -ex "source /tmp/libpython.py" \
              "${GDB_AT_CRASH[@]}" \
              "$(which python)" "$core" < /dev/null || true
          done
          echo "=== summary ($VARIANT): ${crashed:-no crash in 3 runs} ==="
