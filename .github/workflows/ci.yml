name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libmagic1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy crush

      - name: Translation catalogs
        run: python scripts/i18n.py check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libmagic1 \
            libpulse0

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libmagic

      - name: Install Python deps (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Install Python deps (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
          python -m pip install python-magic-bin

      # The .fbs schema tests run the bundled flatc. Not on macOS: there the
      # script builds flatc from source (minutes per run); those tests skip
      # with their reason, the .bfbs tests run everywhere.
      - name: Download flatc (Linux/Windows)
        if: runner.os != 'macOS'
        run: python scripts/download_flatc_binaries.py

      - name: Pytest (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p reports
          python -m pytest -q \
            --junit-xml=reports/junit.xml \
            --html=reports/test_report.html \
            --self-contained-html

      - name: Pytest (Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          python -m pytest -q `
            --junit-xml=reports/junit.xml `
            --html=reports/test_report.html `
            --self-contained-html
        shell: pwsh

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forensic-test-report-${{ matrix.os }}
          path: reports/
          retention-days: 90

  # TEMPORARY -- diagnose the Linux segfault in PropertiesPanel.clear()
  # (test_props_panel_tab_refresh). Not for merging: removed once the cause
  # is fixed. Runs the suite with core dumps and prints the C/C++ stack of
  # every thread from the dump, then once more with glibc's malloc checks,
  # which abort at the free that corrupts the heap instead of at a later
  # victim.
  diagnose-segfault:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Runner image and system libraries
        run: |
          cat /etc/os-release
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          ldd --version | head -1

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gdb \
            libgl1 \
            libegl1 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libmagic1 \
            libpulse0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
          python -m pip list

      - name: Download flatc
        run: python scripts/download_flatc_binaries.py

      # Before/after check of the PropertiesPanel.clear() fix, in the setup
      # that caught the heap corruption (gdb + glibc malloc checks; freed
      # memory is overwritten, so a use-after-free shows reliably): one run
      # with props_panel.py as on main (1fa0699), one with the fix.
      # Each run: "ABORT" = glibc caught the corruption, "OK" = clean.
      - name: Malloc-check runs, before and after the fix
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          MALLOC_CHECK_: "3"
          MALLOC_PERTURB_: "165"
        run: |
          run_suite() {
            local rc=0
            gdb -q -batch -return-child-result \
              -ex "set pagination off" \
              -ex "handle SIGPIPE nostop noprint pass" \
              -ex "set environment LD_PRELOAD /lib/x86_64-linux-gnu/libc_malloc_debug.so.0" \
              -ex run \
              -ex "bt 25" \
              --args python -X faulthandler -m pytest -q -p no:cacheprovider \
              > "/tmp/run-$1.log" 2>&1 || rc=$?
            if grep -q "__libc_fatal\|received signal" "/tmp/run-$1.log"; then
              echo "$1: ABORT (exit $rc)"
              grep -n -m1 -B2 -A30 "received signal" "/tmp/run-$1.log" || true
            else
              echo "$1: OK (exit $rc) -- $(grep -E '[0-9]+ (passed|failed)' "/tmp/run-$1.log" | tail -1)"
            fi
          }
          git show 1fa0699:crush/ui/props_panel.py > crush/ui/props_panel.py
          run_suite before
          git checkout HEAD -- crush/ui/props_panel.py
          run_suite after
          echo "=== summary ==="
          for f in /tmp/run-*.log; do
            n=$(basename "$f" .log)
            if grep -q "__libc_fatal\|received signal" "$f"; then echo "$n ABORT"; else echo "$n OK"; fi
          done
          if ! grep -q "__libc_fatal\|received signal" /tmp/run-before.log; then
            echo "NOTE: the run before the fix did not abort, so this comparison shows nothing."
          fi
