[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crush"
version = "0.22.0"
description = "Crush — Digital Forensic Analysis Workbench"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Marco Neumann (kalink0)" }]
keywords = ["forensics", "dfir", "ios", "android", "artifact", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PySide6~=6.10.2",
    "biplist>=1.0.3",
    "lxml>=5.0",
    "construct>=2.10",
    "python-magic>=0.4.27",
    "filetype>=1.2.0",
    "pypdf>=4.0",
    "pypdfium2>=4.0",
    "protobuf>=4.25",
    "grpcio-tools>=1.62",
    "Pillow>=10.0",
    "pillow-heif>=0.13",
    "pillow-jxl-plugin>=1.3",
    "av>=12.0",
    "pyliblzfse>=0.4.1",
    "astc_decomp_faster>=1.1.0",
    "py7zr>=0.21",
    "cryptography>=42.0",
    # ewfprobe decrypts Apple disk images, AD-encrypted sets and encrypted
    # AFF, and reads private keys, with it (as Cryptodome).
    "pycryptodomex>=3.20",
    "crush-analyze @ git+https://github.com/kalink0/crush-analyze.git@645cb2a414c172ad0710b7eb571dde27543f5278",
    "pyzipper>=0.3.6",
    "sqlcipher3>=0.6.2",
    "pgdumplib>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-html>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "lxml-stubs>=0.5.1",
]

[project.scripts]
crush = "crush.__main__:main"

[project.urls]
Homepage = "https://github.com/kalink0/crush-forensics"
Issues = "https://github.com/kalink0/crush-forensics/issues"

[tool.setuptools.packages.find]
include = ["crush*"]

[tool.pytest.ini_options]
# A run unpacks over 1 GB of containers and images into tmp_path; keep only
# the files of failed tests, and only from the last run (default: every
# test's, from the last three runs).
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["crush/third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = [
    "build/.*",
    "crush/third_party/.*",
]

[[tool.mypy.overrides]]
module = [
    "crush.third_party.*",
    "crush.ui.*",
    "crush.viewers.*",
    "crush.tests.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["pyzipper", "pyzipper.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sqlcipher3", "sqlcipher3.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pgdumplib", "pgdumplib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google.protobuf", "google.protobuf.*", "grpc_tools", "grpc_tools.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pillow_heif", "pillow_heif.*"]
ignore_missing_imports = true
follow_imports = "skip"
